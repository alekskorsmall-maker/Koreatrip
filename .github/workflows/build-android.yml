name: Build KoreaTrip Android

on:
  workflow_dispatch:
  push:
    paths:
      - "koreatrip-android-project.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Extract Android project
        run: |
          unzip -o koreatrip-android-project.zip
          test -d koreatrip-android

      - name: Build APK and AAB
        working-directory: koreatrip-android
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreaTrip-Android-APK
          path: koreatrip-android/app/ build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreaTrip-Android-APK
          path: koreatrip-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
