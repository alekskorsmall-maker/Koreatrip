
name: Build KoreaTrip APK

on:
  workflow_dispatch:
  push:
    paths:
      - "koreatrip-android-project.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o koreatrip-android-project.zip
          test -d koreatrip-android

      - name: Build debug APK
        working-directory: koreatrip-android
        run: |
          gradle --no-daemon assembleDebug
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 100000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreaTrip-APK
          path: koreatrip-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
