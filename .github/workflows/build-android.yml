
name: Build KoreaTrip Android
on:
  workflow_dispatch:
  push:
    paths:
      - "koreatrip-android-project.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -o koreatrip-android-project.zip

      - name: Build Android app
        working-directory: koreatrip-android
        run: gradle --no-daemon bundleRelease

      - name: Save AAB file
        uses: actions/upload-artifact@v4
        with:
          name: KoreaTrip-Android-AAB
          path: koreatrip-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
